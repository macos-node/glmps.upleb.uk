# /etc/nginx/sites-available/glmps.upleb.uk
#
# Drop-in replacement for the existing placeholder vhost on the server.
# Difference from the placeholder: SPA fallback `try_files $uri $uri/ /index.html`
# so /r/<naddr> and any future client-side routes are served by index.html
# instead of returning 404.
#
# Install (root login is off, so copy it over and finish with sudo on the
# server; `upleb.uk` is an SSH host alias):
#   scp nginx-glmps.upleb.uk.conf upleb.uk:
#   ssh -t upleb.uk 'sudo install -m 644 nginx-glmps.upleb.uk.conf /etc/nginx/sites-available/glmps.upleb.uk && sudo nginx -t && sudo systemctl reload nginx'

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name glmps.upleb.uk;

    root /var/www/glmps.upleb.uk;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/blst.upleb.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blst.upleb.uk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Cache hashed assets aggressively; index.html stays fresh
    location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|webp|avif)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name glmps.upleb.uk;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
